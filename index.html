<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranking Complejo Center 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #0f172a; color: white; }
    .banner { width: 100%; height: auto; display: block; }
    .container { max-width: 700px; margin: auto; padding: 12px 12px 24px; }
    .grupo-btns { display: flex; gap: 8px; margin: 12px 0 8px; }
    .grupo-btn { flex: 1; padding: 11px 8px; border-radius: 10px; background: #1e293b; border: 1px solid rgba(255,255,255,0.12); color: #94a3b8; cursor: pointer; font-size: 15px; font-weight: 600; text-align: center; }
    .grupo-btn.active { background: #3b82f6; border-color: #3b82f6; color: white; }
    .cat-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; margin-bottom: 12px; }
    .cat-scroll::-webkit-scrollbar { display: none; }
    .cat-btns { display: flex; gap: 8px; width: max-content; }
    .cat-btn { padding: 9px 18px; border-radius: 20px; background: #1e293b; border: 1px solid rgba(255,255,255,0.12); color: #94a3b8; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .cat-btn.active { background: #1d4ed8; border-color: #3b82f6; color: white; }
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-wrap input { padding: 11px 11px 11px 36px; width: 100%; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 15px; }
    .search-wrap input::placeholder { color: #64748b; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 15px; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #1e293b; }
    th { padding: 10px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #64748b; text-align: left; }
    th:last-child { text-align: right; }
    td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; vertical-align: middle; }
    td:first-child { width: 36px; font-weight: 700; }
    td:last-child { text-align: right; font-weight: 700; width: 56px; }
    tr:last-child td { border-bottom: none; }
    .gold td { color: #facc15; background: rgba(250,204,21,0.07); }
    .silver td { color: #cbd5e1; background: rgba(203,213,225,0.06); }
    .bronze td { color: #fb923c; background: rgba(251,146,60,0.07); }
    .highlight td { background: rgba(59,130,246,0.15) !important; }
    .badge { display: inline-block; border: 1px solid #22c55e; color: #22c55e; background: rgba(34,197,94,0.1); padding: 2px 7px; border-radius: 5px; font-size: 10px; margin-left: 7px; font-weight: 700; vertical-align: middle; white-space: nowrap; }
    .loading { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
    .error { text-align: center; padding: 40px; color: #ef4444; font-size: 14px; }
  </style>
</head>

  <div class="container">
    <div class="grupo-btns" id="grupoBtns"></div>
    <div class="cat-scroll"><div class="cat-btns" id="catBtns"></div></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="buscar" placeholder="Buscar jugador..." oninput="render()">
    </div>
    <div id="tabla"><div class="loading">Cargando ranking...</div></div>
  </div>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9iIeyI3KlIWIpXyIYkZf5nxkuxmiqiYpc5061_4M3-yrSPbc0n6XoJ5lAF-NA7TnBxQ/exec?format=json";
    var data = [];
    var grupoActual = "Caballeros";
    var catActual = 0;

    fetch(SCRIPT_URL)
      .then(function(r) { return r.json(); })
      .then(function(json) {
        data = json;
        renderGrupos();
      })
      .catch(function(err) {
        document.getElementById("tabla").innerHTML = '<div class="error">Error al cargar datos. Reintentá en unos segundos.</div>';
      });

    function renderGrupos() {
      var grupos = [];
      data.forEach(function(d) { if (grupos.indexOf(d.grupo) === -1) grupos.push(d.grupo); });
      var cont = document.getElementById("grupoBtns");
      cont.innerHTML = "";
      grupos.forEach(function(g) {
        var btn = document.createElement("button");
        btn.className = "grupo-btn" + (g === grupoActual ? " active" : "");
        btn.innerText = g;
        btn.onclick = function() { grupoActual = g; catActual = 0; renderGrupos(); };
        cont.appendChild(btn);
      });
      renderCategorias();
    }

    function renderCategorias() {
      var lista = data.filter(function(d) { return d.grupo === grupoActual; });
      var cont = document.getElementById("catBtns");
      cont.innerHTML = "";
      lista.forEach(function(c, i) {
        var btn = document.createElement("button");
        btn.className = "cat-btn" + (i === catActual ? " active" : "");
        btn.innerText = c.label;
        btn.onclick = function() { catActual = i; renderCategorias(); };
        cont.appendChild(btn);
      });
      render();
    }

    function render() {
      var filtro = document.getElementById("buscar").value.toLowerCase().trim();
      var lista = data.filter(function(d) { return d.grupo === grupoActual; });
      if (!lista.length) return;
      var cat = lista[catActual];
      var html = "<table><thead><tr><th>#</th><th>Jugador</th><th>Pts</th></tr></thead><tbody>";
      cat.jugadores.forEach(function(j) {
        if (filtro && j.nombre.toLowerCase().indexOf(filtro) === -1) return;
        var rowCls = j.pos === 1 ? "gold" : j.pos === 2 ? "silver" : j.pos === 3 ? "bronze" : "";
        var hl = filtro ? " highlight" : "";
        var badge = j.estado ? '<span class="badge">' + j.estado + '</span>' : "";
        html += "<tr class='" + rowCls + hl + "'><td>" + j.pos + "</td><td>" + j.nombre + badge + "</td><td>" + j.puntos + "</td></tr>";
      });
      html += "</tbody></table>";
      document.getElementById("tabla").innerHTML = html;
    }
  </script>
